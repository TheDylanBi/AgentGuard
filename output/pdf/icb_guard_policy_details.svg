<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
<rect x="0" y="0" width="1800" height="1200" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.3"/>
<text x="40" y="48" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#32668C">ICB-GUARD</text>
<text x="40" y="88" font-family="Times New Roman,serif" font-size="33" font-weight="700" fill="#172B3A">Policy semantics: hard boundaries, conditional evidence, and effect alignment</text>
<text x="40" y="119" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#566875">Order follows policy.engine.evaluate() then policy.authorize.authorize_action(); P6 can hard-block a prior ALLOW or CONFIRM</text>
<text x="1650" y="48" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#566875">FIGURE 2</text>
<text x="40" y="166" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#32668C">(a)  ENGINE DECISION ORDER</text>
<rect x="40" y="184" width="833" height="109" rx="8" fill="#EDF4F9" stroke="#32668C" stroke-width="1.3"/>
<text x="57" y="214" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#32668C">01  Policy selection + declared capability</text>
<text x="57" y="242" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">Load action YAML; otherwise use valid symbolic rules. Neither available: BLOCK. Require action in declared</text>
<text x="57" y="265" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">actions and satisfy YAML capability requirements.</text>
<polyline points="457,293 457,309" fill="none" stroke="#32668C" stroke-width="1.8"/>
<polygon points="457,309 461.0,299.0 453.0,299.0" fill="#32668C"/>
<rect x="40" y="309" width="833" height="109" rx="8" fill="#EDF4F9" stroke="#32668C" stroke-width="1.3"/>
<text x="57" y="339" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#32668C">02  File boundary + argument consistency</text>
<text x="57" y="367" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">Resolve absolute paths; enforce exact or directory grants. Empty envelope denies. Reject traversal / foreign</text>
<text x="57" y="390" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">paths / Windows alternate streams; reject conflicting target aliases.</text>
<polyline points="457,418 457,434" fill="none" stroke="#32668C" stroke-width="1.8"/>
<polygon points="457,434 461.0,424.0 453.0,424.0" fill="#32668C"/>
<rect x="40" y="434" width="833" height="109" rx="8" fill="#EDF4F9" stroke="#32668C" stroke-width="1.3"/>
<text x="57" y="464" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#32668C">03  Explicit deny + direct sensitive reference</text>
<text x="57" y="492" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">Matching deny rule: BLOCK. A sink directly referencing a known high-risk object: BLOCK. These checks</text>
<text x="57" y="515" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">precede soft approval returns.</text>
<polyline points="457,543 457,559" fill="none" stroke="#32668C" stroke-width="1.8"/>
<polygon points="457,559 461.0,549.0 453.0,549.0" fill="#32668C"/>
<rect x="40" y="559" width="833" height="109" rx="8" fill="#EDF4F9" stroke="#32668C" stroke-width="1.3"/>
<text x="57" y="589" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#32668C">04  Evidence certificate, when required / supplied</text>
<text x="57" y="617" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">Verify signature, signed vs outer fields, full action hash and expiry. Visual actions with unknown or conflicting</text>
<text x="57" y="640" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">evidence: BLOCK.</text>
<polyline points="457,668 457,684" fill="none" stroke="#32668C" stroke-width="1.8"/>
<polygon points="457,684 461.0,674.0 453.0,674.0" fill="#32668C"/>
<rect x="40" y="684" width="833" height="109" rx="8" fill="#EDF4F9" stroke="#32668C" stroke-width="1.3"/>
<text x="57" y="714" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#32668C">05  Intent, finite parameter constraints + uncertainty</text>
<text x="57" y="742" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">No rules: sink / high-risk BLOCK, otherwise CONFIRM. Outside allow rule or insufficient sensitive constraints:</text>
<text x="57" y="765" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">CONFIRM. Derived taint / untrusted visual evidence: CONFIRM.</text>
<polyline points="457,793 457,809" fill="none" stroke="#32668C" stroke-width="1.8"/>
<polygon points="457,809 461.0,799.0 453.0,799.0" fill="#32668C"/>
<rect x="40" y="809" width="833" height="109" rx="8" fill="#EDF4F9" stroke="#32668C" stroke-width="1.3"/>
<text x="57" y="839" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#32668C">06  Final engine checks</text>
<text x="57" y="867" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">Shell requires a non-dangerous command analysis, otherwise CONFIRM (production already blocks host shell).</text>
<text x="57" y="890" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">Remaining checks pass: engine ALLOW.</text>
<polyline points="457,918 457,934" fill="none" stroke="#32668C" stroke-width="1.8"/>
<polygon points="457,934 461.0,924.0 453.0,924.0" fill="#32668C"/>
<rect x="40" y="934" width="833" height="109" rx="8" fill="#EDF7F3" stroke="#24796F" stroke-width="1.3"/>
<text x="57" y="964" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#24796F">07  Behavior alignment (P6), after engine</text>
<text x="57" y="992" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">Preserve engine BLOCK. With effect schema + profile, violations become BLOCK. Schema present but profile</text>
<text x="57" y="1015" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">absent: downgrade engine ALLOW to CONFIRM.</text>
<text x="913" y="166" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#32668C">(b)  POLICY COMPONENTS</text>
<rect x="913" y="184" width="847" height="170" rx="8" fill="#EDF4F9" stroke="#32668C" stroke-width="1.3"/>
<text x="930" y="214" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#32668C">Symbolic least privilege</text>
<text x="930" y="242" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">Rules = {tool, allow / deny, predicate}; validated before matching.</text>
<text x="930" y="265" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">DSL: true, and/or/not, eq/ne, le/ge, in/not_in, glob, contains.</text>
<text x="930" y="288" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">Sensitive values require positive finite eq/in constraints on every accepted branch. AND combines constrained</text>
<text x="930" y="311" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">fields; OR keeps only common fields.</text>
<text x="930" y="334" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">Raw parameter semantics are preserved: no blanket lowercase or URL decoding.</text>
<rect x="913" y="374" width="847" height="186" rx="8" fill="#EDF7F3" stroke="#24796F" stroke-width="1.3"/>
<text x="930" y="404" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#24796F">Expected effects vs extracted effects</text>
<text x="930" y="432" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">Expected: intent targets, recipients, data types, max_items and forbidden effects; capability-denied effects are</text>
<text x="930" y="455" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">added to the forbidden set.</text>
<text x="930" y="478" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">Actual: deterministic extraction from declared effect schema + action parameters.</text>
<text x="930" y="501" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">Checks: tool, scoped URL/path targets, recipients, data types, recipient-count limit and forbidden effects. Sensitive</text>
<text x="930" y="524" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">unknown effects: BLOCK.</text>
<text x="930" y="547" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">Scope lists are conditional; max_items currently counts recipients, not all operations.</text>
<rect x="913" y="580" width="847" height="198" rx="8" fill="#EDF4F9" stroke="#32668C" stroke-width="1.3"/>
<text x="930" y="610" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#32668C">Visual evidence path</text>
<text x="930" y="638" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">A11y has priority: matching perceptual evidence supports it; disagreement yields conflict. A structured source</text>
<text x="930" y="661" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">alone can establish trust.</text>
<text x="930" y="684" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">Otherwise: two agreeing source types establish trust; one is untrusted; none is unknown. Region agreement =</text>
<text x="930" y="707" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">intersection / smaller area (default 0.5).</text>
<text x="930" y="730" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">Optional previous capture: instability downgrades trust. Attached mode uses a fresh capture without</text>
<text x="930" y="753" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">previous-frame comparison.</text>
<rect x="913" y="798" width="847" height="155" rx="8" fill="#EDF7F3" stroke="#24796F" stroke-width="1.3"/>
<text x="930" y="828" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#24796F">Two-level taint (P5)</text>
<text x="930" y="856" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">Source declarations include credential access and high-risk source categories.</text>
<text x="930" y="879" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">Sink declarations include network egress, external share and persistence.</text>
<text x="930" y="902" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">Direct object / path-boundary reference: BLOCK; other sinks after a source read: CONFIRM. Source reads are</text>
<text x="930" y="925" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#172B3A">marked conservatively at ticket consumption.</text>
<rect x="913" y="973" width="847" height="135" rx="8" fill="#FCF5E8" stroke="#A66B1B" stroke-width="1.3"/>
<text x="930" y="1003" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#A66B1B">What these checks do not establish</text>
<text x="930" y="1031" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#172B3A">Provenance does not authorize a task. Intent alignment does not establish request safety. Extracted effects are not</text>
<text x="930" y="1053" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#172B3A">observed execution.</text>
<text x="930" y="1075" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#172B3A">Taint is session/object based; nested references are not fully traced. Generic parameter_constraints remain metadata.</text>
<text x="40" y="1101" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#A04749">Hard BLOCK is never converted to ALLOW by approval.</text>
<text x="40" y="1172" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#566875">Conditional execution is explicit: optional verifier backends may be unavailable; effect alignment requires both a declared effect schema and an effect profile.</text>
</svg>